<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AI Background Remover</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white p-5">
    <div class="max-w-md mx-auto text-center">
        <h1 class="text-xl font-bold mb-4">AI Background Remover</h1>
        
        <div id="progress-wrapper" class="hidden">
            <p id="progress-text" class="text-xs text-yellow-500">Mempersiapkan AI (Download 43MB sekali saja)...</p>
            <div class="w-full bg-gray-700 h-2 mt-2 rounded"><div id="progress-bar" class="h-full bg-green-500 w-0"></div></div>
        </div>

        <input type="file" id="file-input" class="hidden" accept="image/*">
        <button id="btn-upload" class="bg-blue-600 px-6 py-2 rounded-lg mt-4 w-full">Pilih Foto</button>
        <img id="output" class="mt-4 w-full rounded-lg hidden">
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        env.allowLocalModels = true; // Paksa simpan di browser user

        const progressWrapper = document.getElementById('progress-wrapper');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('progress-text');
        
        let remover;

        // Inisialisasi AI (Download ke IndexedDB browser)
        async function loadAI() {
            progressWrapper.classList.remove('hidden');
            remover = await pipeline('image-segmentation', 'Xenova/RMBG-1.4', {
                progress_callback: (p) => {
                    const prog = Math.round(p.progress || 0);
                    progressBar.style.width = prog + '%';
                    statusText.innerText = `Download: ${prog}%`;
                }
            });
            progressWrapper.classList.add('hidden');
            statusText.innerText = "AI Siap!";
        }
        loadAI();

        document.getElementById('btn-upload').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = async (e) => {
            const url = URL.createObjectURL(e.target.files[0]);
            statusText.innerText = "Memotong background...";
            progressWrapper.classList.remove('hidden');
            
            const result = await remover(url);
            document.getElementById('output').src = result.data;
            document.getElementById('output').classList.remove('hidden');
            progressWrapper.classList.add('hidden');
        };
    </script>
</body>
</html>
