<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AI Remover - Final Edition</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1"></script>
</head>
<body style="font-family: sans-serif; background: #111; color: white; text-align: center; padding: 20px;">
    <h1>AI Background Remover</h1>
    <p id="status">Lagi loading modul AI (tunggu sebentar)...</p>
    
    <input type="file" id="upload" accept="image/*">
    <br><br>
    <img id="hasil" style="max-width: 300px; display: none;">

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        // MENGHINDARI DOWNLOAD BERULANG
        env.allowLocalModels = true;
        env.useBrowserCache = true;

        const status = document.getElementById('status');
        
        async function run() {
            try {
                status.innerText = "Modul AI sedang disiapkan (ini cuma sekali kok)...";
                const remover = await pipeline('image-segmentation', 'Xenova/RMBG-1.4');
                status.innerText = "AI sudah siap! Silakan pilih foto.";
                
                document.getElementById('upload').onchange = async (e) => {
                    status.innerText = "Sedang proses...";
                    const url = URL.createObjectURL(e.target.files[0]);
                    const output = await remover(url);
                    document.getElementById('hasil').src = output.data;
                    document.getElementById('hasil').style.display = 'block';
                    status.innerText = "Selesai!";
                };
            } catch (err) {
                status.innerText = "Error: " + err.message + ". Coba pakai koneksi lain (Hotspot HP).";
            }
        }
        run();
    </script>
</body>
</html>
