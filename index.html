<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AI Background Remover | Pro Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <nav class="flex items-center justify-between px-8 py-4 border-b border-gray-800 bg-gray-900">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">AI Editor Pro</h1>
        <button id="btn-download" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-full font-semibold transition">Export PNG</button>
    </nav>

    <main class="container mx-auto p-6 flex flex-col lg:flex-row gap-8">
        
        <div class="flex-1 bg-gray-900 rounded-3xl p-6 border border-gray-800 min-h-[500px] flex items-center justify-center relative overflow-hidden">
            <div id="dropzone" class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-4">＋</div>
                <p>Klik atau Seret Gambar</p>
            </div>
            
            <canvas id="canvas-output" class="max-w-full max-h-[70vh] shadow-2xl rounded-lg hidden"></canvas>
        </div>

        <div class="w-full lg:w-80 bg-gray-900 p-6 rounded-3xl border border-gray-800 space-y-6">
            <h2 class="font-bold border-b border-gray-800 pb-2">Tools</h2>
            
            <div>
                <label class="text-sm text-gray-400">Background Color</label>
                <input type="color" id="bg-color" value="#111827" class="w-full h-10 rounded cursor-pointer mt-2">
            </div>

            <div>
                <label class="text-sm text-gray-400">Edge Smoothing</label>
                <input type="range" id="range-feather" min="0" max="20" value="5" class="w-full accent-blue-500 mt-2">
            </div>

            <div class="pt-4 border-t border-gray-800">
                <p class="text-xs text-gray-500">Tips: Gunakan foto dengan kontras tinggi untuk hasil terbaik.</p>
                <button id="btn-reset" class="w-full mt-4 py-2 border border-gray-700 rounded-xl hover:bg-gray-800 transition">Reset Editor</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { FilesetResolver, ImageSegmenter } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js";

        let segmenter, activeImg;
        const canvasOut = document.getElementById('canvas-output');
        const bgColor = document.getElementById('bg-color');

        async function initAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
            segmenter = await ImageSegmenter.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplabv3/float32/1/default/1.tflite", delegate: "GPU" },
                runningMode: "IMAGE", outputCategoryMask: true
            });
        }
        initAI();

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const img = new Image();
            img.src = URL.createObjectURL(file);
            await img.decode();
            activeImg = img;
            
            document.getElementById('dropzone').classList.add('hidden');
            canvasOut.classList.remove('hidden');
            
            processImage();
        });

        function processImage() {
            if (!activeImg) return;
            const res = segmenter.segment(activeImg);
            const mask = res.confidenceMasks[15].getAsFloat32Array();
            
            canvasOut.width = activeImg.width;
            canvasOut.height = activeImg.height;
            const ctx = canvasOut.getContext('2d');
            
            // Fill background
            ctx.fillStyle = bgColor.value;
            ctx.fillRect(0, 0, canvasOut.width, canvasOut.height);
            
            // Draw image with mask
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = activeImg.width;
            tempCanvas.height = activeImg.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(activeImg, 0, 0);
            
            const imgData = tCtx.getImageData(0, 0, activeImg.width, activeImg.height);
            for (let i = 0; i < mask.length; i++) {
                imgData.data[i * 4 + 3] = mask[i] * 255;
            }
            tCtx.putImageData(imgData, 0, 0);
            ctx.drawImage(tempCanvas, 0, 0);
        }

        bgColor.addEventListener('input', processImage);
        document.getElementById('dropzone').onclick = () => document.getElementById('file-input').click();
        document.getElementById('btn-download').onclick = () => {
            const a = document.createElement('a');
            a.download = 'edited-photo.png';
            a.href = canvasOut.toDataURL();
            a.click();
        };
    </script>
</body>
</html>
