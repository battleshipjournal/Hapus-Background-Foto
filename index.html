<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Remover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <main class="container mx-auto p-6 flex flex-col lg:flex-row gap-8">
        <div class="flex-1 bg-gray-900 rounded-3xl p-6 border border-gray-800 min-h-[500px] flex items-center justify-center relative overflow-hidden">
            
            <div id="dropzone" class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-800/30 transition z-20">
                <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-30" accept="image/*">
                <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mb-4 text-3xl pointer-events-none">＋</div>
                <p class="pointer-events-none">Klik di sini untuk pilih foto</p>
            </div>

            <div id="loading" class="hidden text-blue-400 animate-pulse font-bold">MEMPROSES AI...</div>
            <canvas id="canvas-output" class="max-w-full max-h-[70vh] shadow-2xl rounded-lg hidden"></canvas>
        </div>

        <div id="sidebar-controls" class="w-full lg:w-80 bg-gray-900 p-6 rounded-3xl border border-gray-800 space-y-6 opacity-30 pointer-events-none transition-opacity duration-300">
            <h2 class="font-bold border-b border-gray-800 pb-2 uppercase text-xs text-gray-500">Editor Tools</h2>
            <input type="color" id="bg-color" value="#111827" class="w-full h-10 rounded cursor-pointer mt-2 bg-transparent border-0">
            <button id="btn-reset" class="w-full py-3 border border-gray-700 rounded-xl hover:bg-gray-800 transition font-bold text-sm">RESET EDITOR</button>
        </div>
    </main>

    <script type="module">
        import { FilesetResolver, ImageSegmenter } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/vision_bundle.js";

        let segmenter, activeImg;
        const canvasOut = document.getElementById('canvas-output');
        const fileInput = document.getElementById('file-input');

        // Init AI
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
        segmenter = await ImageSegmenter.createFromOptions(vision, {
            baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplabv3/float32/1/default/1.tflite", delegate: "GPU" },
            runningMode: "IMAGE", outputCategoryMask: true
        });

        // Event Langsung ke Input
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('dropzone').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            activeImg = new Image();
            activeImg.src = URL.createObjectURL(file);
            await activeImg.decode();

            canvasOut.width = activeImg.width;
            canvasOut.height = activeImg.height;
            canvasOut.classList.remove('hidden');
            
            runSegmenter();
        });

        function runSegmenter() {
            if (!activeImg) return;
            const results = segmenter.segment(activeImg);
            const mask = results.confidenceMasks[15].getAsFloat32Array();
            const ctx = canvasOut.getContext('2d');
            
            ctx.fillStyle = document.getElementById('bg-color').value;
            ctx.fillRect(0, 0, canvasOut.width, canvasOut.height);
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = activeImg.width;
            tempCanvas.height = activeImg.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(activeImg, 0, 0);
            
            const imgData = tCtx.getImageData(0, 0, activeImg.width, activeImg.height);
            for (let i = 0; i < mask.length; i++) {
                imgData.data[i * 4 + 3] = mask[i] * 255;
            }
            tCtx.putImageData(imgData, 0, 0);
            ctx.drawImage(tempCanvas, 0, 0);

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('sidebar-controls').classList.remove('opacity-30', 'pointer-events-none');
        }

        document.getElementById('btn-reset').onclick = () => location.reload();
    </script>
</body>
</html>
