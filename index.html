<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Remover Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen">

    <header class="border-b border-slate-800 bg-[#111827]/60 backdrop-blur-md px-6 py-4 sticky top-0 z-50">
        <h1 class="text-xl font-extrabold text-emerald-400 uppercase tracking-widest">AI Background Remover Pro</h1>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="lg:col-span-3 space-y-6">
            <div id="dropzone" class="relative border-2 border-dashed border-slate-700 bg-[#111827]/30 rounded-2xl p-12 flex flex-col items-center justify-center min-h-[450px] cursor-pointer hover:border-emerald-400 transition-all">
                <input type="file" id="file-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-50">
                <div class="text-6xl mb-4">＋</div>
                <p class="text-xl font-bold">Klik di sini untuk pilih foto</p>
            </div>

            <div id="loading" class="hidden text-center py-20 text-emerald-400 animate-pulse">Memproses AI...</div>

            <div id="preview-container" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                <img id="img-original" class="rounded-xl border border-slate-800">
                <div class="checkerboard rounded-xl border border-slate-800 overflow-hidden">
                    <canvas id="canvas-output" class="max-w-full"></canvas>
                </div>
            </div>
        </div>

        <div id="sidebar-controls" class="bg-[#111827]/50 border border-slate-800 rounded-2xl p-6 space-y-6 opacity-30 pointer-events-none transition-opacity">
            <label class="block text-sm">Feather (Haluskan Tepi): <span id="val-feather">0px</span></label>
            <input type="range" id="range-feather" min="0" max="20" value="0" class="w-full accent-emerald-400">
            
            <button id="btn-download" class="w-full bg-emerald-500 py-3 rounded-xl font-bold text-black hover:bg-emerald-400">DOWNLOAD PNG</button>
            <button id="btn-reset" class="w-full bg-slate-800 py-3 rounded-xl hover:bg-slate-700">RESET</button>
        </div>
    </main>

    <style>
        .checkerboard { background-image: linear-gradient(45deg, #090e17 25%, transparent 25%), linear-gradient(-45deg, #090e17 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #090e17 75%), linear-gradient(-45deg, transparent 75%, #090e17 75%); background-size: 16px 16px; }
    </style>

    <script>
        const selfieSegmentation = new SelfieSegmentation({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}` });
        selfieSegmentation.setOptions({ modelSelection: 1 });
        
        let lastResults = null;

        // Input File
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            document.getElementById('dropzone').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => selfieSegmentation.send({image: img});
                img.src = event.target.result;
                document.getElementById('img-original').src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // AI Result Handler
        selfieSegmentation.onResults((results) => {
            lastResults = results;
            renderCanvas();
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('preview-container').classList.remove('hidden');
            document.getElementById('sidebar-controls').classList.remove('opacity-30', 'pointer-events-none');
        });

        // Render & Feather Logic
        function renderCanvas() {
            if (!lastResults) return;
            const canvas = document.getElementById('canvas-output');
            const ctx = canvas.getContext('2d');
            const feather = parseInt(document.getElementById('range-feather').value);
            
            canvas.width = lastResults.image.width;
            canvas.height = lastResults.image.height;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.filter = feather > 0 ? `blur(${feather}px)` : 'none';
            ctx.drawImage(lastResults.segmentationMask, 0, 0);
            
            ctx.globalCompositeOperation = 'source-in';
            ctx.filter = 'none';
            ctx.drawImage(lastResults.image, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
        }

        // Listeners
        document.getElementById('range-feather').addEventListener('input', (e) => {
            document.getElementById('val-feather').innerText = e.target.value + "px";
            renderCanvas();
        });

        document.getElementById('btn-reset').onclick = () => location.reload();
        document.getElementById('btn-download').onclick = () => {
            const link = document.createElement('a');
            link.download = 'hasil-edit.png';
            link.href = document.getElementById('canvas-output').toDataURL();
            link.click();
        };
    </script>
</body>
</html>
