<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AI Remover - Drive Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-10">
    <div class="max-w-md mx-auto">
        <h1 class="text-center font-bold text-xl mb-5">AI Remover (Drive Edition)</h1>
        <div id="progress">0%</div>
        <input type="file" id="file-input" accept="image/*">
        <img id="output" class="mt-5 w-full hidden">
    </div>

    <script>
        const MODEL_URL = "https://docs.google.com/uc?export=download&id=1nvKkTMKirzg9mcScSFaSi-v3jvNk135U";
        const progress = document.getElementById('progress');

        async function loadModel() {
            // Kita download manual biar bisa dipantau
            const response = await fetch(MODEL_URL);
            const reader = response.body.getReader();
            const contentLength = +response.headers.get('Content-Length');
            
            let receivedLength = 0;
            let chunks = [];
            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                chunks.push(value);
                receivedLength += value.length;
                progress.innerText = `Download: ${Math.round(receivedLength/contentLength*100)}%`;
            }
            
            const blob = new Blob(chunks);
            const arrayBuffer = await blob.arrayBuffer();
            
            // Inisialisasi ONNX Runtime langsung dari array buffer file Drive kamu
            const session = await ort.InferenceSession.create(arrayBuffer);
            alert("Model siap di memori!");
        }

        loadModel();
    </script>
</body>
</html>
