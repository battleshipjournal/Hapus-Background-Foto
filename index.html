<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AI Background Remover - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body style="background: #1a1a1a; color: white; text-align: center; padding: 50px;">
    <h1>AI Background Remover</h1>
    <p id="status">Menyiapkan AI...</p>
    
    <input type="file" id="upload" accept="image/*">
    <br><br>
    <img id="hasil" style="max-width: 300px; display: none;">

    <script>
        const MODEL_URL = "https://huggingface.co/Richard990/model.onnx/resolve/main/model.onnx";
        const status = document.getElementById('status');
        let session;

        async function initAI() {
            try {
                status.innerText = "Downloading model (160MB)... Tunggu sebentar!";
                // Load model dari link kamu
                session = await ort.InferenceSession.create(MODEL_URL);
                status.innerText = "AI Siap! Pilih foto.";
            } catch (err) {
                status.innerText = "Error: " + err.message;
            }
        }

        initAI();

        document.getElementById('upload').onchange = async (e) => {
            status.innerText = "Memproses...";
            const file = e.target.files[0];
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async () => {
                // Sederhanakan gambar jadi tensor
                const tensor = tf.browser.fromPixels(img).resizeBilinear([1024, 1024]).expandDims(0).toFloat().div(255);
                
                // Jalankan AI
                const feeds = { [session.inputNames[0]]: new ort.Tensor('float32', tensor.dataSync(), [1, 3, 1024, 1024]) };
                const output = await session.run(feeds);
                
                status.innerText = "Selesai!";
                // Tampilkan hasil (perlu diproses lagi untuk jadi canvas)
                // (Kodingan ini adalah dasar untuk menjalankan session AI)
            }
        };
    </script>
</body>
</html>
