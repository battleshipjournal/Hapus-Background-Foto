<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Remover - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen p-6 font-sans">

    <div class="max-w-xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-center bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">AI Background Remover</h1>

        <div id="download-box" class="bg-[#111827] border border-slate-800 p-6 rounded-2xl hidden">
            <p id="status-text" class="text-sm text-emerald-400 mb-3 font-mono">Memulai download model AI (43MB)...</p>
            <div class="w-full bg-slate-800 rounded-full h-3">
                <div id="progress-bar" class="bg-emerald-500 h-3 rounded-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <div id="upload-box" class="border-2 border-dashed border-slate-700 p-12 rounded-2xl text-center cursor-pointer hover:border-emerald-500 transition-colors">
            <input type="file" id="file-input" class="hidden">
            <p>Klik untuk pilih foto</p>
        </div>

        <div id="preview-box" class="hidden space-y-4">
            <img id="output-img" class="rounded-xl w-full">
            <button id="btn-reset" class="w-full py-3 bg-slate-800 rounded-xl">Ganti Foto</button>
        </div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        // Agar AI tersimpan di cache browser dan gak download ulang
        env.allowLocalModels = true; 

        const downloadBox = document.getElementById('download-box');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const uploadBox = document.getElementById('upload-box');

        let remover;

        async function initAI() {
            downloadBox.classList.remove('hidden');
            uploadBox.classList.add('hidden');

            try {
                remover = await pipeline('image-segmentation', 'Xenova/RMBG-1.4', {
                    progress_callback: (p) => {
                        const percent = Math.round(p.progress || 0);
                        progressBar.style.width = percent + '%';
                        statusText.innerText = `Mengunduh otak AI: ${percent}%...`;
                    }
                });
                
                downloadBox.classList.add('hidden');
                uploadBox.classList.remove('hidden');
            } catch (err) {
                statusText.innerText = "Error: Cek koneksi internetmu!";
            }
        }

        initAI();

        // Proses Potong
        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            const url = URL.createObjectURL(file);
            
            uploadBox.classList.add('hidden');
            statusText.innerText = "Sedang memotong... (tunggu sebentar)";
            downloadBox.classList.remove('hidden');

            const result = await remover(url);
            document.getElementById('output-img').src = result.data;
            document.getElementById('preview-box').classList.remove('hidden');
            downloadBox.classList.add('hidden');
        };

        uploadBox.onclick = () => document.getElementById('file-input').click();
    </script>
</body>
</html>
