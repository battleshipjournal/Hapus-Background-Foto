<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Remover Pro - Optimized</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@gradio/client@1.4.0/dist/index.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <header class="border-b border-slate-800 bg-[#111827]/60 p-4">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent uppercase tracking-widest">AI Background Remover Pro</h1>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-6 space-y-6">
        <div id="dropzone" class="border-2 border-dashed border-slate-700 bg-[#111827]/30 rounded-2xl p-10 flex flex-col items-center justify-center cursor-pointer hover:border-emerald-400 transition-all">
            <input type="file" id="file-input" accept="image/*" class="hidden">
            <p class="text-emerald-400 font-bold">KLIK UNTUK UPLOAD FOTO</p>
        </div>

        <div id="loading" class="hidden border border-slate-800 bg-[#111827]/40 rounded-2xl p-10 text-center">
            <div class="w-12 h-12 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-emerald-400 font-mono animate-pulse">Memotong background di cloud...</p>
        </div>

        <div id="preview-container" class="hidden grid grid-cols-2 gap-4">
            <div class="border border-slate-800 rounded-xl p-2"><img id="img-original" class="rounded-lg"></div>
            <div class="border border-slate-800 rounded-xl p-2 bg-slate-900"><img id="img-output" class="rounded-lg"></div>
        </div>

        <div id="controls" class="hidden flex gap-4">
            <button id="btn-download" class="flex-1 bg-emerald-500 text-slate-900 font-bold py-3 rounded-xl">DOWNLOAD</button>
            <button id="btn-reset" class="flex-1 bg-slate-800 text-white font-bold py-3 rounded-xl">RESET</button>
        </div>
    </main>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@1.4.0/dist/index.min.js";
        
        const HUGGINGFACE_SPACE_ID = "Richard990/hapus-background-ai"; 
        
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const loading = document.getElementById('loading');
        const preview = document.getElementById('preview-container');
        const controls = document.getElementById('controls');
        const imgOrig = document.getElementById('img-original');
        const imgOut = document.getElementById('img-output');

        dropzone.onclick = () => fileInput.click();

        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            dropzone.classList.add('hidden');
            loading.classList.remove('hidden');
            imgOrig.src = URL.createObjectURL(file);

            // Optimasi: Resize gambar sebelum kirim (Max 1000px)
            const img = new Image();
            img.src = imgOrig.src;
            await img.decode();
            const canvas = document.createElement('canvas');
            const scale = Math.min(1000 / img.width, 1000 / img.height, 1);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                try {
                    const client = await Client.connect(HUGGINGFACE_SPACE_ID);
                    const result = await client.predict("/process", { image: blob });
                    imgOut.src = result.data.url;
                    loading.classList.add('hidden');
                    preview.classList.remove('hidden');
                    controls.classList.remove('hidden');
                } catch (err) {
                    alert("Error: Pastikan server di Hugging Face sudah Running (Hijau).");
                    location.reload();
                }
            }, 'image/png');
        };

        document.getElementById('btn-download').onclick = () => {
            const a = document.createElement('a');
            a.href = imgOut.src;
            a.download = "hasil_ai.png";
            a.click();
        };

        document.getElementById('btn-reset').onclick = () => location.reload();
    </script>
</body>
</html>
