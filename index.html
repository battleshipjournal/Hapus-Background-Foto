<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AI Background Remover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

    <div id="page-1" class="text-center w-full max-w-sm">
        <h1 class="text-2xl font-bold mb-4">Memuat AI Engine</h1>
        <div class="w-full bg-gray-800 h-4 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <p id="status-text" class="mt-2 text-sm text-gray-400">Menghubungkan ke server...</p>
    </div>

    <div id="page-2" class="hidden w-full max-w-md bg-gray-900 p-6 rounded-2xl shadow-xl">
        <h1 class="text-xl font-bold mb-4 text-center">Background Remover</h1>
        <input type="file" id="upload" class="hidden" accept="image/*">
        <button onclick="document.getElementById('upload').click()" class="w-full bg-blue-600 py-3 rounded-lg font-bold hover:bg-blue-500 transition">Pilih Foto</button>
        
        <div class="mt-6 flex justify-center">
            <img id="hasil" class="max-w-full rounded-lg border-2 border-gray-700 hidden">
        </div>
        <p id="edit-status" class="mt-4 text-center text-sm text-gray-400"></p>
    </div>

    <script>
        const MODEL_URL = "https://huggingface.co/Richard990/model.onnx/resolve/main/model.onnx";
        let session;

        // --- PAGE 1 LOGIC ---
        async function loadModel() {
            try {
                const response = await fetch(MODEL_URL);
                const reader = response.body.getReader();
                const total = parseInt(response.headers.get("content-length"));
                let received = 0;
                let chunks = [];

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    const percent = Math.round((received / total) * 100);
                    document.getElementById('progress-bar').style.width = percent + '%';
                    document.getElementById('status-text').innerText = `Mendownload: ${percent}%`;
                }

                const blob = new Blob(chunks);
                const buffer = await blob.arrayBuffer();
                session = await ort.InferenceSession.create(buffer);
                
                // Pindah ke Page 2
                document.getElementById('page-1').classList.add('hidden');
                document.getElementById('page-2').classList.remove('hidden');
            } catch (err) {
                document.getElementById('status-text').innerText = "Gagal: " + err.message;
            }
        }

        // --- PAGE 2 LOGIC ---
        document.getElementById('upload').onchange = async (e) => {
            const status = document.getElementById('edit-status');
            const output = document.getElementById('hasil');
            status.innerText = "Memproses...";
            
            const img = new Image();
            img.src = URL.createObjectURL(e.target.files[0]);
            img.onload = async () => {
                const tensor = tf.browser.fromPixels(img).resizeBilinear([1024, 1024]).expandDims(0).toFloat().div(255);
                const feeds = { [session.inputNames[0]]: new ort.Tensor('float32', tensor.dataSync(), [1, 3, 1024, 1024]) };
                const outputRes = await session.run(feeds);
                
                // Masking logic
                const mask = outputRes[session.outputNames[0]].data;
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < imgData.data.length / 4; i++) {
                    imgData.data[i * 4 + 3] = mask[i] * 255;
                }
                ctx.putImageData(imgData, 0, 0);
                
                output.src = canvas.toDataURL('image/png');
                output.classList.remove('hidden');
                status.innerText = "Selesai! Klik kanan gambar untuk simpan.";
            }
        };

        loadModel();
    </script>
</body>
</html>
